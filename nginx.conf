#!/bin/bash
set -e

echo "=== DOCKER BLUE/GREEN + NGINX PROXY ==="

# Build image
docker build -t nginx-app .

# Create network if not exists
docker network create app-network || true

# Run BLUE
docker rm -f blue-app || true
docker run -d --name blue-app --network app-network nginx-app

# Run GREEN
docker rm -f green-app || true
docker run -d --name green-app --network app-network nginx-app

# Remove old proxy
docker rm -f nginx-proxy || true

# Run proxy (pointing to BLUE initially)
docker run -d \
  --name nginx-proxy \
  --network app-network \
  -p 80:80 \
  -v $(pwd)/nginx.conf:/etc/nginx/nginx.conf \
  nginx

echo "Deployment complete"
