name: CI/CD Deploy to Private EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy via Bastion
      uses: appleboy/ssh-action@v0.1.6

      with:
        host: ${{ secrets.BASTION_IP }}
        username: ubuntu
        key: ${{ secrets.BASTION_KEY }}

        script: |
          ssh ubuntu@10.0.141.140 << 'EOF'
            cd ~/devops-private-nginx-site

            git pull origin main

            chmod +x deploy.sh

            ./deploy.sh
          EOF
