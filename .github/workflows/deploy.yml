name: CI/CD Deploy to Private EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via Bastion Host
        uses: appleboy/ssh-action@v0.1.6

        with:
          host: ${{ secrets.BASTION_IP }}
          username: ubuntu
          key: ${{ secrets.BASTION_KEY }}
          port: 22

          script: |
            echo "✅ Connected to Bastion"

            # Create SSH directory on Bastion
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh

            # Add private EC2 SSH key
            printf "%s\n" "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2-key
            chmod 600 ~/.ssh/ec2-key

            echo "🚀 Connecting to Private EC2..."

            ssh -i ~/.ssh/ec2-key -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOF'

              echo "✅ Inside Private EC2"

              cd ~/devops-private-nginx-site

              # Ensure clean state (production-safe deployment)
              git fetch origin main
              git reset --hard origin/main

              chmod +x deploy.sh

              ./deploy.sh

            EOF
